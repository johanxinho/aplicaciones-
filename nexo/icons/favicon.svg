<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <defs>
    <!-- Gradientes principales Aurora -->
    <linearGradient id="nexo-left" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="50%" stop-color="#6366F1"/>
      <stop offset="100%" stop-color="#4F46E5"/>
    </linearGradient>
    <linearGradient id="nexo-diag" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#818CF8"/>
      <stop offset="50%" stop-color="#A855F7"/>
      <stop offset="100%" stop-color="#EC4899"/>
    </linearGradient>
    <linearGradient id="nexo-right" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#9333EA"/>
      <stop offset="50%" stop-color="#C084FC"/>
      <stop offset="100%" stop-color="#38BDF8"/>
    </linearGradient>
    <radialGradient id="nexo-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#818CF8" stop-opacity="0.6"/>
      <stop offset="60%" stop-color="#6366F1" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#6366F1" stop-opacity="0"/>
    </radialGradient>
    <filter id="soft-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Resplandor central -->
  <circle cx="50" cy="50" r="38" fill="url(#nexo-glow)"/>

  <!-- Columna Izquierda del Nexo -->
  <path d="M 24 76 L 24 32 C 24 26 31 23 35 27 L 41 33 C 43 35 44 38 44 41 L 44 76 C 44 80 39 82 36 79 L 26 79 C 24.9 79 24 77.7 24 76 Z" 
        fill="url(#nexo-left)"/>

  <!-- Columna Derecha del Nexo -->
  <path d="M 76 24 L 76 68 C 76 74 69 77 65 73 L 59 67 C 57 65 56 62 56 59 L 56 24 C 56 20 61 18 64 21 L 74 21 C 75.1 21 76 22.3 76 24 Z" 
        fill="url(#nexo-right)"/>

  <!-- Barra Diagonal Conectora (El Nexus) -->
  <path d="M 25 31 C 23.5 28.5 26.5 25.5 29 27.5 L 75 69 C 76.5 71.5 73.5 74.5 71 72.5 L 25 31 Z" 
        fill="url(#nexo-diag)" filter="url(#soft-glow)"/>

  <!-- Núcleo de Energía Central (Spark de IA) -->
  <g transform="translate(50, 50)">
    <path d="M 0 -7 Q 1 -1 7 0 Q 1 1 0 7 Q -1 1 -7 0 Q -1 -1 0 -7 Z" fill="#FFFFFF" opacity="0.95"/>
    <circle cx="0" cy="0" r="1.5" fill="#FFFFFF"/>
  </g>
</svg>
